spring.application.name=autoloc-api

# Datasource MySQL (identifiants lus depuis les variables d'environnement)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Logs : INFO au demarrage, DEBUG pour le SQL genere
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
