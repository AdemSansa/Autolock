spring.application.name=autoloc-api
server.servlet.context-path=/api

# Datasource MySQL (identifiants lus depuis les variables d'environnement)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate : par dǸfaut, on vǸrifie le schǸma sans le modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

# Palliatif de sérialisation des proxys Hibernate (Atelier 5), à retirer avec les DTO (chapitre 10)
spring.jackson.serialization.fail-on-empty-beans=false

logging.level.root=INFO
