spring.application.name=autoloc-api

# Datasource MySQL (identifiants lus depuis les variables d'environnement)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate : par défaut, on vérifie le schéma sans le modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.root=INFO
